name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json

      - run: npm ci && npm run lint && npm run build
        working-directory: app

      - run: npm ci && npx playwright install --with-deps chromium webkit && npm test
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist

  deploy:
    needs: build
    # Push to main -> live. Same-repo PR -> preview channel (fork PRs have no secrets, so skip).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'push'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WIZARD1_F16DE }}
          projectId: wizard1-f16de
          channelId: live
          entryPoint: ./app

      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: github.event_name == 'pull_request'
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WIZARD1_F16DE }}
          projectId: wizard1-f16de
          entryPoint: ./app
